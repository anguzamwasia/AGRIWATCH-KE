# render.yaml — Render.com deployment config for AgriWatch KE
# © 2026 Cynthia Anguza — IGAD Hackathon 2026
#
# Free tier: 512 MB RAM, shared CPU.
# Note: Free instances spin down after 15 min of inactivity.
# First request after sleep takes ~20–30 s to wake up.
# Upgrade to 'starter' ($7/mo) for always-on during judging period.

services:
  - type: web
    name: agriwatch-ke-backend
    env: python
    region: oregon            # change to 'frankfurt' for lower latency from Kenya
    plan: free                # change to 'starter' during judging
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/debug
    rootDir: Backend
    envVars:
      - key: GEMINI_API_KEY
        sync: false           # set manually in Render dashboard — never commit this
      - key: GEE_PROJECT
        sync: false           # set manually in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: agriwatch-ke-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://agriwatch-ke.vercel.app

databases:
  - name: agriwatch-ke-db
    databaseName: agriwatch_ke
    plan: free                # 256 MB PostgreSQL — free forever on Render
    region: oregon
